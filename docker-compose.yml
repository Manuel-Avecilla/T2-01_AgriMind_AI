services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agrimind
      POSTGRES_PASSWORD: agrimind_pass
      POSTGRES_DB: agrimind
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimind -d agrimind"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: agrimind
      DB_PASSWORD: agrimind_pass
      DB_NAME: agrimind
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
